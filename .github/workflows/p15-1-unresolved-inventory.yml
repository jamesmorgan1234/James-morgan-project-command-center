name: P15.1 Unresolved Inventory

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - '.github/workflows/p15-1-unresolved-inventory.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Emit exact unresolved inventory
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const p='clean-room/evidence/category15-requirement-traceability.json';
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const rows=d.requirements.filter(r=>r.truthState==='UNVERIFIED');
          const out='clean-room/evidence/p15-1-unresolved-inventory';
          fs.rmSync(out,{recursive:true,force:true});
          fs.mkdirSync(out,{recursive:true});
          const keep=r=>({
            id:r.id,
            requirement:r.requirement,
            authoritativeSource:r.authoritativeSource,
            sourceFiles:r.sourceFiles||[],
            sourceKinds:r.sourceKinds||[],
            architectureBranch:r.architectureBranch||'',
            architectureOwner:r.architectureOwner||'',
            classification:r.classification||'',
            activationPrerequisites:r.activationPrerequisites||''
          });
          const size=200;
          for(let i=0;i<rows.length;i+=size){
            const chunk=rows.slice(i,i+size).map(keep);
            const a=String(i+1).padStart(4,'0');
            const b=String(Math.min(i+size,rows.length)).padStart(4,'0');
            fs.writeFileSync(path.join(out,`unresolved-${a}-${b}.json`),JSON.stringify(chunk,null,2)+'\n');
          }
          const countBy=(fn)=>Object.entries(rows.reduce((m,r)=>{const k=fn(r)||'(blank)';m[k]=(m[k]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1]);
          const summary={
            sourceCommit:process.env.GITHUB_SHA,
            total:d.requirements.length,
            verified:d.requirements.filter(r=>r.truthState==='VERIFIED').length,
            notApplicable:d.requirements.filter(r=>r.truthState==='NOT_APPLICABLE').length,
            unresolved:rows.length,
            firstUnresolved:rows[0]?.id||null,
            lastUnresolved:rows.at(-1)?.id||null,
            byArchitectureOwner:countBy(r=>r.architectureOwner),
            byArchitectureBranch:countBy(r=>r.architectureBranch),
            byClassification:countBy(r=>r.classification),
            byPrimarySourceFile:countBy(r=>(r.sourceFiles||[])[0]||'(none)')
          };
          fs.writeFileSync(path.join(out,'summary.json'),JSON.stringify(summary,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clean-room/evidence/p15-1-unresolved-inventory
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: snapshot exact unresolved P15.1 inventory'
          git push origin HEAD:build/spec-lock-v2-clean-room
