name: Prepare rollback PR

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact known-good commit SHA to restore
        required: true
        type: string
      reason:
        description: Why this rollback is needed
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate target commit
        id: validate
        shell: bash
        env:
          TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --prune
          git cat-file -e "$TARGET^{commit}"
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "Target must be an ancestor of current main." >&2
            exit 1
          fi
          SHORT="$(git rev-parse --short=10 "$TARGET")"
          BRANCH="rollback/${GITHUB_RUN_ID}-${SHORT}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "target=$(git rev-parse "$TARGET")" >> "$GITHUB_OUTPUT"
      - name: Restore target tree on a new branch
        shell: bash
        env:
          TARGET: ${{ steps.validate.outputs.target }}
          BRANCH: ${{ steps.validate.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" origin/main
          git rm -r --ignore-unmatch .
          git checkout "$TARGET" -- .
          git add -A
          if git diff --cached --quiet; then
            echo "Target tree already matches current main; nothing to rollback." >&2
            exit 1
          fi
          git commit -m "Prepare rollback to ${TARGET}"
          git push origin "$BRANCH"
      - name: Open rollback pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.validate.outputs.branch }}
          TARGET: ${{ steps.validate.outputs.target }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Rollback production to ${TARGET:0:12}" \
            --body "Controlled rollback request.\n\nTarget known-good commit: \`$TARGET\`\n\nReason: $REASON\n\nThis workflow only prepares a PR. It does not merge or push directly to main. Normal QA and production verification are still required."
