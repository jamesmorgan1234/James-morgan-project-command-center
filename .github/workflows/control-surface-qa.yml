name: Command Center control surface QA
on:
  push:
    branches: [main]
    paths:
      - 'command-center-control-surface.js'
      - 'command-center-control-surface.css'
      - 'command-center-approved-nav.js'
      - 'command-center-agent-runner-status.js'
      - 'COMMAND_CENTER_PRODUCT_ROADMAP.md'
      - 'supabase/migrations/*agent_auto*'
      - '.github/workflows/control-surface-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check command-center-control-surface.js && node --check command-center-approved-nav.js && node --check command-center-agent-runner-status.js
      - name: Verify approved layout preservation and controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q "data-cc-control-auto" command-center-control-surface.js
          grep -q "command_center_agent_service_get_auto" command-center-control-surface.js
          grep -q "command_center_agent_service_set_auto" command-center-control-surface.js
          grep -q "data-cc-about-action" command-center-control-surface.js
          grep -q "Brain" command-center-control-surface.js
          grep -q "Automation" command-center-control-surface.js
          grep -q "Integrations" command-center-control-surface.js
          grep -q "Analytics" command-center-control-surface.js
          grep -q "Security" command-center-control-surface.js
          grep -q "Deployment" command-center-control-surface.js
          grep -q "command-center-control-surface.js?v=2" command-center-approved-nav.js
          grep -q "command-center-control-surface.css?v=1" command-center-approved-nav.js
          grep -q "AUTO OFF" command-center-agent-runner-status.js
          grep -q "AUTO ON" command-center-agent-runner-status.js
          grep -q "auth.uid() <> p_owner_id" supabase/migrations/*harden_agent_auto_owner_control.sql
          grep -q "homeCard('projects'" command-center-approved-ui.js
          grep -q "homeCard('next'" command-center-approved-ui.js
          grep -q "homeCard('agent'" command-center-approved-ui.js
          grep -q "homeCard('revenue'" command-center-approved-ui.js
