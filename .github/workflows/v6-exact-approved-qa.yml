name: V6 Exact Approved QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'startup-loader.js'
      - 'command-center-startup-shell.css'
      - 'command-center-v6.css'
      - 'command-center-v6.js'
      - 'command-center-v6-2.css'
      - 'command-center-v6-2.js'
      - 'command-center-v6-art.css'
      - 'command-center-exact-menus.css'
      - 'command-center-exact-menus.js'
      - 'command-center-book-covers.css'
      - 'command-center-brain-home.css'
      - 'command-center-brain-home.js'
      - 'command-center-brain-roadmaps.css'
      - 'command-center-brain-workspaces.css'
      - 'command-center-brain-memory.js'
      - 'command-center-brain-brainstorm.js'
      - 'project-roadmaps.css'
      - 'project-roadmaps.js'
      - 'command-center-project-detail-accordions.css'
      - 'command-center-project-detail-accordions.js'
      - 'app-integrity-repair.js'
      - 'supabase/migrations/**'
      - 'operating-order-exclusion.js'
      - 'refresh-orchestrator.js'
      - 'source-health.js'
      - 'cc6-eclipse.webp'
      - 'cc6-mountain.webp'
      - 'cc6-chart.webp'
      - 'cc6-road.webp'
      - 'mobile-accordion-polish.css'
      - 'mobile-accordion-polish.js'
      - 'app-config.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'PWA_UPDATE_STANDARD.md'
      - 'command-center-approved-icon-512.png'
      - 'tests/**'
      - '.github/workflows/v6-exact-approved-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-approved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check startup-loader.js
      - run: node --check app-config.js
      - run: node --check command-center-v6.js
      - run: node --check command-center-v6-2.js
      - run: node --check command-center-exact-menus.js
      - run: node --check command-center-brain-home.js
      - run: node --check command-center-brain-memory.js
      - run: node --check command-center-brain-brainstorm.js
      - run: node --check project-roadmaps.js
      - run: node --check command-center-project-detail-accordions.js
      - run: node --check app-integrity-repair.js
      - run: node --check refresh-orchestrator.js
      - run: node --check source-health.js
      - run: node --check operating-order-exclusion.js
      - run: node --check mobile-accordion-polish.js
      - run: node tests/startup-boot.test.mjs
      - run: node tests/v6-exact-approved.test.mjs
      - run: node tests/exact-command-center-menus.test.mjs
      - run: node tests/brain-capability-roadmaps.test.mjs
      - run: node tests/brain-memory.test.mjs
      - run: node tests/brain-brainstorm.test.mjs
      - run: node tests/project-roadmaps.test.mjs
      - run: node tests/project-detail-accordion.test.mjs
      - run: node tests/app-integrity.test.mjs
      - run: node tests/refresh-stability.test.mjs
      - run: node tests/pwa-icon-update.test.mjs
      - run: node tests/mobile-navigation.test.mjs
      - run: node tests/scope-progress.test.mjs
      - run: node tests/v4-control-room.test.mjs
