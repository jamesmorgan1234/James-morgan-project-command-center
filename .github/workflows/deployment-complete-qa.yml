name: Deployment complete QA

on:
  pull_request:
    paths:
      - 'DEPLOYMENT_STANDARD.md'
      - 'deployment-release-manifest.json'
      - 'command-center-deployment.css'
      - 'command-center-deployment.js'
      - 'command-center-deployment-completion.js'
      - 'app-config.js'
      - 'index.html'
      - 'service-worker.js'
      - 'supabase/migrations/20261021_deployment_complete.sql'
      - '.github/workflows/prepare-rollback-pr.yml'
      - 'tests/deployment-complete.test.mjs'
      - '.github/workflows/deployment-complete-qa.yml'

permissions:
  contents: read

jobs:
  deployment-complete-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Deployment runtime
        run: |
          node --check command-center-deployment.js
          node --check command-center-deployment-completion.js
      - name: Run Deployment completion QA
        run: node tests/deployment-complete.test.mjs
