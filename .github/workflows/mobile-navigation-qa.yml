name: Mobile navigation QA

on:
  pull_request:
    paths:
      - 'mobile-accordion-polish.js'
      - 'service-worker.js'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'tests/mobile-navigation.test.mjs'
      - '.github/workflows/mobile-navigation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-navigation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mobile navigation QA
        run: node tests/mobile-navigation.test.mjs
