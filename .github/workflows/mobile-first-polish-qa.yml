name: Mobile-first polish QA

on:
  pull_request:
    paths:
      - 'command-center-mobile-first.css'
      - 'command-center-agent-mode-completion.js'
      - 'service-worker.js'
      - 'index.html'
      - 'tests/mobile-first-polish.test.mjs'
      - '.github/workflows/mobile-first-polish-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-first-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check final loader
        run: node --check command-center-agent-mode-completion.js
      - name: Run mobile-first visual regression checks
        run: node tests/mobile-first-polish.test.mjs
      - name: Re-run protected mobile navigation checks
        run: node tests/mobile-navigation.test.mjs
