name: P15.1 Final Mapping Stage

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - '.github/workflows/p15-1-final-mapping-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Stage exact final reviewed mappings atomically
        shell: bash
        env:
          MAPPING_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$MAPPING_GZ_B64" | base64 -d | gzip -dc > clean-room/scripts/p15-1-reviewed-upstream-recertified-closure-mappings.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('clean-room/scripts/p15-1-current-reviewed-mappings.mjs')
          s=p.read_text(encoding='utf-8')
          imp="import {reviewedUpstreamRecertifiedClosureMappings} from './p15-1-reviewed-upstream-recertified-closure-mappings.mjs';\n"
          if imp not in s:
              marker="import {reviewedRecoveryMappings} from './p15-1-reviewed-recovery-mappings.mjs';\n"
              if marker not in s: raise SystemExit('aggregator import marker missing')
              s=s.replace(marker,marker+imp)
          spread='  ...reviewedUpstreamRecertifiedClosureMappings(),\n'
          if spread not in s:
              marker='  ...reviewedWorkBatch1ExistingProofMappings(),\n'
              if marker not in s: raise SystemExit('aggregator spread marker missing')
              s=s.replace(marker,marker+spread)
          p.write_text(s,encoding='utf-8')
          PY
          node clean-room/scripts/p15-1-reviewed-mapping-preflight.mjs clean-room/scripts/p15-1-reviewed-upstream-recertified-closure-mappings.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {currentReviewedMappings} from './clean-room/scripts/p15-1-current-reviewed-mappings.mjs';
          const ledger=JSON.parse(fs.readFileSync('clean-room/evidence/category15-requirement-traceability.json','utf8'));
          const unresolved=new Set(ledger.requirements.filter(r=>r.truthState==='UNVERIFIED').map(r=>r.id));
          const maps=currentReviewedMappings(process.cwd());
          const ids=new Set(maps.map(r=>r.id));
          const missing=[...unresolved].filter(id=>!ids.has(id));
          if(maps.length!==5852 || ids.size!==5852 || unresolved.size!==2728 || missing.length) throw new Error(JSON.stringify({maps:maps.length,unique:ids.size,unresolved:unresolved.size,missing:missing.length}));
          console.log(JSON.stringify({maps:maps.length,unresolvedCovered:unresolved.size,missing:missing.length}));
          NODE
          rm -f .github/workflows/p15-1-final-mapping-stage.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete reviewed P15.1 upstream traceability mappings'
          git push origin HEAD:build/spec-lock-v2-clean-room
