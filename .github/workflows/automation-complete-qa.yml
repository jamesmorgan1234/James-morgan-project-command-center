name: Automation complete QA

on:
  pull_request:
    paths:
      - 'command-center-automation-advanced.css'
      - 'command-center-automation-advanced.js'
      - 'command-center-automation-completion.js'
      - 'command-center-brain-home.js'
      - 'app-config.js'
      - 'service-worker.js'
      - 'supabase/migrations/20261021_automation_phases4_8_*.sql'
      - 'tests/automation-complete.test.mjs'
      - 'tests/brain-capability-roadmaps.test.mjs'
      - '.github/workflows/automation-complete-qa.yml'

permissions:
  contents: read

jobs:
  automation-complete-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse advanced Automation runtime
        run: |
          node --check command-center-automation-advanced.js
          node --check command-center-automation-completion.js
      - name: Run Automation completion QA
        run: |
          node tests/automation-complete.test.mjs
          node tests/brain-capability-roadmaps.test.mjs
