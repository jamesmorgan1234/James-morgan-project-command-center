name: Spec Lock v2 Clean Room QA

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - 'clean-room/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  pull_request:
    paths:
      - 'clean-room/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-15:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clean-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package.json
      - name: Install zero-cost build dependency
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Category 15 exact-head QA and release gates
        run: npm test
      - name: Publish Category 15 audit summaries
        if: always()
        run: |
          test -f category15-repository-audit.json && cat category15-repository-audit.json | jq '{trackedFileCount,reviewedFileCount,semanticEveryFileReviewComplete,secretFindingCount:(.secretFindings|length),violationCount:(.violations|length)}' || true
          test -f category15-phase-status.json && cat category15-phase-status.json | jq '{canonicalTotalsValid,allCategory15DefinitionsPresent,canonicalLedgerPresent,phases}' || true
