name: Spec Lock v2 Clean Room QA

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - 'clean-room/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  pull_request:
    paths:
      - 'clean-room/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clean-room
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package.json
      - name: Install zero-cost build dependency
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Category 15 exact-head core QA and release gates
        run: |
          npm run check:legacy
          npm run audit:repository
          npm run build
          npm run audit:artifact
          npm run test:modules
          npm run audit:release-candidate
      - name: P15.14 observed PWA lifecycle
        run: bash scripts/category15-pwa-lifecycle.sh
      - name: Final Category 15 nonproduction phase gate
        env:
          CATEGORY15_PWA_LIFECYCLE_VERIFIED: 'true'
        run: npm run audit:category15
      - name: P15.16 production live evidence gate
        run: npm run audit:production-live
      - name: Publish Category 15 audit summaries
        if: always()
        run: |
          test -f category15-repository-audit.json && cat category15-repository-audit.json | jq '{trackedFileCount,reviewedFileCount,semanticEveryFileReviewComplete,secretFindingCount:(.secretFindings|length),violationCount:(.violations|length)}' || true
          test -f category15-phase-status.json && cat category15-phase-status.json | jq '{canonicalTotalsValid,allCategory15DefinitionsPresent,canonicalLedgerPresent,phases}' || true
