name: Spec Lock v2 Clean Room QA

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - 'clean-room/**'
      - 'roadmap/**'
      - 'supabase/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  pull_request:
    paths:
      - 'clean-room/**'
      - 'roadmap/**'
      - 'supabase/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clean-room
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package-lock.json
      - name: Install locked zero-cost dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Current authority / phase / Amendment-20 validation
        run: npm run audit:authority
      - name: Typecheck
        run: npm run typecheck
      - name: Legacy exclusion gate
        run: npm run check:legacy
      - name: Repository audit gate
        run: npm run audit:repository
      - name: Preserve source-bound repository audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p15-1-repository-audit-${{ github.sha }}
          path: clean-room/category15-repository-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: P15.1 owner blocker proof test
        run: node --test --test-reporter=spec tests/p15-1-agent-owner-device-blocker-contract.test.mjs
      - name: Build modules
        run: npm run build:modules
      - name: Build browser
        run: npm run build:browser
      - name: Embedded module tests
        run: npm run test:modules
      - name: Artifact audit gate
        run: npm run audit:artifact
      - name: Exact-head module test gate
        run: npm run test:modules
      - name: Release-candidate audit gate
        run: npm run audit:release-candidate
      - name: P15.14 observed PWA lifecycle
        run: bash scripts/category15-pwa-lifecycle.sh
      - name: Final Category 15 nonproduction phase gate
        env:
          CATEGORY15_PWA_LIFECYCLE_VERIFIED: 'true'
        run: npm run audit:category15
      - name: P15.16 production live evidence gate
        run: npm run audit:production-live
      - name: Publish audit summaries
        if: always()
        run: |
          test -f current-authority-audit.json && cat current-authority-audit.json | jq '{headSha,ok,currentPhaseCount,amendment20SectionCount,amendment20AtomicRequirementCount,pifMappedCapabilityFamilyCount,errorCount:(.errors|length)}' || true
          test -f category15-repository-audit.json && cat category15-repository-audit.json | jq '{headSha,trackedFileCount,scannedFileCount,automatedEveryFileScanComplete,semanticEveryFileReviewComplete,secretFindingCount:(.secretFindings|length),violationCount:(.violations|length)}' || true
          test -f category15-phase-status.json && cat category15-phase-status.json | jq '{currentPhaseCount,canonicalTotalsValid,allCategory15DefinitionsPresent,canonicalRequirementAuthoritySatisfied,phases}' || true
          node scripts/p15-1-a00-unresolved-progress-report.mjs --limit=15
