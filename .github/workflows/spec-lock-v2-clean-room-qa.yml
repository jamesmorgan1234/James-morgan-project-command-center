name: Spec Lock v2 Clean Room QA

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
  pull_request:
    paths:
      - 'clean-room/**'
      - 'roadmap/**'
      - 'supabase/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  category-15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clean-room
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package-lock.json
      - name: Install locked zero-cost dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Current authority / phase / Amendment-20 validation
        run: npm run audit:authority
      - name: Typecheck
        run: npm run typecheck
      - name: Legacy exclusion gate
        run: npm run check:legacy
      - name: Architecture source gate
        run: npm run check:architecture
      - name: Refresh P15.2 every-file review for exact head
        run: node scripts/p15-2-semantic-every-file-review.mjs --write
      - name: Repository audit gate
        run: npm run audit:repository
      - name: Preserve source-bound repository audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p15-1-repository-audit-${{ github.sha }}
          path: clean-room/category15-repository-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Export authoritative P15.1 review slice
        run: node scripts/p15-1-export-authoritative-row-slice.mjs --write
      - name: Preserve authoritative P15.1 review slice
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p15-1-authoritative-row-slice-${{ github.sha }}
          path: clean-room/p15-1-authoritative-row-slice.json
          if-no-files-found: error
          retention-days: 7
      - name: P15.1 owner blocker proof test
        run: node --test --test-reporter=spec tests/p15-1-agent-owner-device-blocker-contract.test.mjs
      - name: Build modules
        run: npm run build:modules
      - name: Build browser
        run: npm run build:browser
      - name: Load completed exact-head source and nonproduction qualification
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          qualification_run=""
          for attempt in $(seq 1 120); do
            row="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/p15-1-requalify-reviewed-mappings.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10" --jq '.workflow_runs | sort_by(.run_number) | last | [.id // "",.status // "",.conclusion // ""] | @tsv')"
            IFS=$'\t' read -r run_id status conclusion <<< "$row"
            if [ -n "$run_id" ] && [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              qualification_run="$run_id"
              break
            fi
            sleep 5
          done
          test -n "$qualification_run"
          git fetch origin build/spec-lock-v2-clean-room
          QUALIFICATION_RUN="$qualification_run" node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          import {validateReceiptBinding} from './scripts/phase-receipt-binding.mjs';
          const root='..',ref='origin/build/spec-lock-v2-clean-room',source=process.env.GITHUB_SHA;
          const git=(...args)=>execFileSync('git',args,{cwd:root,encoding:'utf8'}).trim();
          if(git('rev-parse','HEAD')!==source)throw Error('QA must retain the exact source HEAD');
          git('merge-base','--is-ancestor',source,ref);
          const files=['clean-room/evidence/category15-requirement-traceability.json','clean-room/evidence/P15_2_SEMANTIC_EVERY_FILE_REVIEW.json','clean-room/evidence/P15_13_RELEASE_ARTIFACT_AUDIT.json','clean-room/evidence/P15_14_NONPRODUCTION_ACCEPTANCE.json','clean-room/evidence/phase-receipts/P15_13.json','clean-room/evidence/phase-receipts/P15_14.json'];
          const changed=git('diff','--name-only',source,ref).split('\n').filter(Boolean);
          if(changed.some(path=>!files.includes(path)))throw Error('Refusing qualification from a different runtime/configuration source');
          const contents=new Map(files.map(path=>[path,git('show',ref+':'+path)+'\n']));
          const ledger=JSON.parse(contents.get(files[0])),v=ledger.verification,ci=v?.ci;
          if(v?.sourceCommit!==source||ci?.runId!==Number(process.env.QUALIFICATION_RUN)||ci?.status!=='completed'||ci?.conclusion!=='success'||ci?.coreQaConclusion!=='success'||!Number.isSafeInteger(ci?.testPass)||ci.testPass<1||ci?.testFail!==0||ci?.testSkipped!==0||ledger.repositoryEvidence?.valid!==true)throw Error('Source-bound completed QA evidence required');
          for(const path of files.slice(2,4)){const report=JSON.parse(contents.get(path));if(report.headSha!==source||report.verified!==true||report.failedCheckCount!==0)throw Error('Actual exact-head nonproduction audit required');}
          const browserReport=JSON.parse(contents.get(files[3]));if(browserReport.browser?.lifecycleVerified!==true||browserReport.contractResults?.fail!==0||!Number.isSafeInteger(browserReport.contractResults?.pass)||browserReport.contractResults.pass<5)throw Error('Actual browser and contract results required');
          for(const path of files.slice(4)){if(JSON.parse(contents.get(path)).gitSha!==source)throw Error('Phase receipt must name the qualified source');}
          for(const [path,content]of contents)writeFileSync('../'+path,content);
          for(const path of files.slice(4)){const receipt=JSON.parse(contents.get(path));if(!validateReceiptBinding(receipt,{repoRoot:root,headSha:source}))throw Error('Phase receipt inputs do not match audited source');}
          console.log('Imported only validated qualification evidence for '+source);
          NODE
          npm run audit:authority
          npm run audit:repository
      - name: Embedded module tests
        run: npm run test:modules
      - name: Artifact audit gate
        run: npm run audit:artifact
      - name: Exact-head module test gate
        run: npm run test:modules
      - name: Release-candidate audit gate
        run: npm run audit:release-candidate
      - name: P15.14 observed PWA lifecycle
        run: bash scripts/category15-pwa-lifecycle.sh
      - name: Final Category 15 nonproduction phase gate
        id: category15_nonproduction_gate
        env:
          CATEGORY15_PWA_LIFECYCLE_VERIFIED: 'true'
        run: npm run audit:category15
      - name: P15.16 production live evidence gate
        if: ${{ success() || (failure() && steps.category15_nonproduction_gate.outcome == 'failure') }}
        run: npm run audit:production-live
      - name: Publish audit summaries
        if: always()
        run: |
          test -f current-authority-audit.json && cat current-authority-audit.json | jq '{headSha,ok,currentPhaseCount,amendment20SectionCount,amendment20AtomicRequirementCount,pifMappedCapabilityFamilyCount,errorCount:(.errors|length)}' || true
          test -f category15-repository-audit.json && cat category15-repository-audit.json | jq '{headSha,trackedFileCount,scannedFileCount,automatedEveryFileScanComplete,semanticEveryFileReviewComplete,secretFindingCount:(.secretFindings|length),violationCount:(.violations|length)}' || true
          test -f category15-phase-status.json && cat category15-phase-status.json | jq '{currentPhaseCount,canonicalTotalsValid,allCategory15DefinitionsPresent,canonicalRequirementAuthoritySatisfied,phases}' || true
          node scripts/p15-1-a00-unresolved-progress-report.mjs --limit=15
