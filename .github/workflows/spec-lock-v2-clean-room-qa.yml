name: Spec Lock v2 Clean Room QA

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - 'clean-room/**'
      - 'roadmap/**'
      - 'supabase/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  pull_request:
    paths:
      - 'clean-room/**'
      - 'roadmap/**'
      - 'supabase/**'
      - '.github/workflows/spec-lock-v2-clean-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-15:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clean-room
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package.json
      - name: Install zero-cost build dependency
        run: npm install --no-audit --no-fund --ignore-scripts --no-save typescript@5.8.3
      - name: Current authority / phase / Amendment-20 validation
        run: npm run audit:authority
      - name: Typecheck
        run: npm run typecheck
      - name: Legacy exclusion gate
        run: npm run check:legacy
      - name: Repository audit gate
        run: npm run audit:repository
      - name: P15.1 owner blocker proof test
        run: node --test --test-reporter=spec tests/p15-1-agent-owner-device-blocker-contract.test.mjs
      - name: Build modules
        run: npm run build:modules
      - name: Build browser
        run: npm run build:browser
      - name: Diagnostic tests — Category 1 and Categories 13-15
        continue-on-error: true
        run: node --test --test-reporter=spec tests/category1-*.test.mjs tests/category13-*.test.mjs tests/category14-*.test.mjs tests/category15-*.test.mjs
      - name: Diagnostic tests — Categories 2-4
        continue-on-error: true
        run: node --test --test-reporter=spec tests/category2-*.test.mjs tests/category3-*.test.mjs tests/category4-*.test.mjs
      - name: Diagnostic tests — Categories 5-8
        continue-on-error: true
        run: node --test --test-reporter=spec tests/category5-*.test.mjs tests/category6-*.test.mjs tests/category7-*.test.mjs tests/category8-*.test.mjs
      - name: Diagnostic tests — P8-P10
        continue-on-error: true
        run: node --test --test-reporter=spec tests/p8-*.test.mjs tests/p9-*.test.mjs tests/p10-*.test.mjs
      - name: Diagnostic tests — P11-P12
        continue-on-error: true
        run: node --test --test-reporter=spec tests/p11-*.test.mjs tests/p12-*.test.mjs
      - name: Diagnostic tests — P13-P15
        continue-on-error: true
        run: node --test --test-reporter=spec tests/p13-*.test.mjs tests/p14-*.test.mjs tests/p15-*.test.mjs
      - name: Diagnostic tests — PIF, post-audit, REV3, task preservation
        continue-on-error: true
        run: node --test --test-reporter=spec tests/pif*.test.mjs tests/post-audit-*.test.mjs tests/rev3-*.test.mjs tests/r3-*.test.mjs tests/task*.test.mjs
      - name: Diagnostic tests — remaining foundations and runtime surfaces
        continue-on-error: true
        run: node --test --test-reporter=spec tests/agency-foundation.test.mjs tests/analytics-foundation.test.mjs tests/books-foundation.test.mjs tests/brain-foundation.test.mjs tests/current-*.test.mjs tests/data-platform-*.test.mjs tests/finance-*.test.mjs tests/kernel-foundation.test.mjs tests/owner-*.test.mjs tests/personal-ops-foundation.test.mjs tests/projects-foundation.test.mjs tests/recovery-scale-foundation.test.mjs tests/route-state-closure.test.mjs tests/runtime-*.test.mjs tests/security-foundation.test.mjs tests/social-foundation.test.mjs tests/specialists-foundation.test.mjs tests/supabase-*.test.mjs tests/ui-shell-foundation.test.mjs
      - name: Embedded module tests
        run: npm run test:modules
      - name: Artifact audit gate
        run: npm run audit:artifact
      - name: Exact-head module test gate
        run: npm run test:modules
      - name: Release-candidate audit gate
        run: npm run audit:release-candidate
      - name: P15.14 observed PWA lifecycle
        run: bash scripts/category15-pwa-lifecycle.sh
      - name: Final Category 15 nonproduction phase gate
        env:
          CATEGORY15_PWA_LIFECYCLE_VERIFIED: 'true'
        run: npm run audit:category15
      - name: P15.16 production live evidence gate
        run: npm run audit:production-live
      - name: Publish audit summaries
        if: always()
        run: |
          test -f current-authority-audit.json && cat current-authority-audit.json | jq '{headSha,ok,currentPhaseCount,amendment20SectionCount,amendment20AtomicRequirementCount,pifMappedCapabilityFamilyCount,errorCount:(.errors|length)}' || true
          test -f category15-repository-audit.json && cat category15-repository-audit.json | jq '{headSha,trackedFileCount,scannedFileCount,automatedEveryFileScanComplete,semanticEveryFileReviewComplete,secretFindingCount:(.secretFindings|length),violationCount:(.violations|length)}' || true
          test -f category15-phase-status.json && cat category15-phase-status.json | jq '{currentPhaseCount,canonicalTotalsValid,allCategory15DefinitionsPresent,canonicalRequirementAuthoritySatisfied,phases}' || true
          node scripts/p15-1-a00-unresolved-progress-report.mjs --limit=15
