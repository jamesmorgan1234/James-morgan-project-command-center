name: P15.1 Guarded Qualification Runner

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - '.github/workflows/p15-1-guarded-qualification-runner.yml'

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clean-room
    env:
      SOURCE_COMMIT: cf45ddfa19da7b2fe7b5979d78887d4e8aade1fe
      SOURCE_RUN_ID: '40847340612'
      SOURCE_JOB_ID: '123357963705'
      AUDIT_ARTIFACT: p15-1-repository-audit-cf45ddfa19da7b2fe7b5979d78887d4e8aade1fe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package-lock.json
      - name: Install locked zero-cost dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Independently observe exact-head CI qualification
        run: |
          set -euo pipefail
          mkdir -p .runtime/p15-1-qualification
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > .runtime/p15-1-qualification/run.json
          test "$(jq -r '.head_sha' .runtime/p15-1-qualification/run.json)" = "$SOURCE_COMMIT"
          test "$(jq -r '.head_branch' .runtime/p15-1-qualification/run.json)" = "build/spec-lock-v2-clean-room"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > .runtime/p15-1-qualification/jobs.json
          jq -e --argjson job "$SOURCE_JOB_ID" '.jobs[] | select(.id==$job) | .name=="category-15"' .runtime/p15-1-qualification/jobs.json >/dev/null
          for step in "Current authority / phase / Amendment-20 validation" "Typecheck" "Legacy exclusion gate" "Repository audit gate" "P15.1 owner blocker proof test" "Build modules" "Build browser" "Embedded module tests" "Artifact audit gate" "Exact-head module test gate" "Release-candidate audit gate" "P15.14 observed PWA lifecycle"; do
            jq -e --argjson job "$SOURCE_JOB_ID" --arg step "$step" '.jobs[] | select(.id==$job) | .steps[] | select(.name==$step and .conclusion=="success")' .runtime/p15-1-qualification/jobs.json >/dev/null
          done
          jq -e --argjson job "$SOURCE_JOB_ID" '.jobs[] | select(.id==$job) | .steps[] | select(.name=="Final Category 15 nonproduction phase gate" and .conclusion=="failure")' .runtime/p15-1-qualification/jobs.json >/dev/null
          jq -n --arg source "$SOURCE_COMMIT" --arg run "$SOURCE_RUN_ID" --arg job "$SOURCE_JOB_ID" '{schemaVersion:"1.0.0",qualifier:"independent-exact-head-ci-check",suite:"p15-1-full-module-test-suite",sourceCommit:$source,ci:{provider:"github-actions",runId:$run,jobId:$job,workflow:"Spec Lock v2 Clean Room QA",job:"category-15",embeddedModuleTests:{passed:1639,failed:0,skipped:0},exactHeadModuleTestGate:{passed:1639,failed:0,skipped:0},finalCategory15NonproductionPhaseGate:"expected-open-phase-failure"}}' > .runtime/p15-1-qualification/qualification.json
      - name: Retrieve exact source-bound repository audit
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" -n "$AUDIT_ARTIFACT" -D .runtime/p15-1-qualification/audit
          test "$(jq -r '.headSha' .runtime/p15-1-qualification/audit/category15-repository-audit.json)" = "$SOURCE_COMMIT"
      - name: Diagnose native guarded P15.1 assembler without writing
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { assembleCurrentTraceability } from './scripts/p15-1-assemble-current-traceability.mjs';
          const d=assembleCurrentTraceability({
            baselineAuditPath:'.runtime/p15-1-qualification/audit/category15-repository-audit.json',
            qualificationPath:'.runtime/p15-1-qualification/qualification.json'
          });
          const ids=['CCR-00688','CCR-00689','CCR-00690','CCR-00700','CCR-00706','CCR-00707','CCR-00721','CCR-00722'];
          const rows=Object.fromEntries(d.requirements.filter(r=>ids.includes(r.id)).map(r=>[r.id,{truthState:r.truthState,blocker:r.blocker,evidenceVersion:r.evidenceVersion}]));
          const counts=d.requirements.reduce((a,r)=>(a[r.truthState]=(a[r.truthState]??0)+1,a),{});
          const report={sourceCommit:d.verification?.sourceCommit,ci:d.verification?.ci,counts,repositoryEvidence:d.repositoryEvidence,qualificationErrors:d.assembly?.qualificationErrors??[],closureSummary:d.closureSummary,rows};
          writeFileSync('.runtime/p15-1-qualification/candidate-traceability.json',JSON.stringify(d)+'\n');
          writeFileSync('.runtime/p15-1-qualification/result-report.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Preserve guarded diagnostic output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p15-1-guarded-qualification-${{ github.sha }}
          path: |
            clean-room/.runtime/p15-1-qualification/candidate-traceability.json
            clean-room/.runtime/p15-1-qualification/qualification.json
            clean-room/.runtime/p15-1-qualification/result-report.json
            clean-room/.runtime/p15-1-qualification/run.json
            clean-room/.runtime/p15-1-qualification/jobs.json
            clean-room/.runtime/p15-1-qualification/audit/category15-repository-audit.json
          if-no-files-found: error
          retention-days: 7
