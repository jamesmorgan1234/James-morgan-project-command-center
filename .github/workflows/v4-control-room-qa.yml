name: V4 control room QA

on:
  pull_request:
    paths:
      - 'command-center-v4.js'
      - 'command-center-v4.css'
      - 'COMMAND_CENTER_PIPELINE.md'
      - 'app-config.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'tests/v4-control-room.test.mjs'
      - '.github/workflows/v4-control-room-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v4-control-room-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run V4 control room QA
        run: node tests/v4-control-room.test.mjs
      - name: Run existing mobile navigation QA
        run: node tests/mobile-navigation.test.mjs
      - name: Run existing scope progress QA
        run: node tests/scope-progress.test.mjs
