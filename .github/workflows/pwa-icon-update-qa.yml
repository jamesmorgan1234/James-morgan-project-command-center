name: PWA icon update QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app-config.js'
      - 'startup-loader.js'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'command-center-approved-icon-512.png'
      - 'command-center-approved-icon-256.png'
      - 'PWA_UPDATE_STANDARD.md'
      - 'tests/pwa-icon-update.test.mjs'
      - 'tests/startup-boot.test.mjs'
      - '.github/workflows/pwa-icon-update-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-icon-update-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse startup controller
        run: node --check startup-loader.js
      - name: Parse app config
        run: node --check app-config.js
      - name: Run first-launch boot QA
        run: node tests/startup-boot.test.mjs
      - name: Run PWA icon update QA
        run: node tests/pwa-icon-update.test.mjs
      - name: Run mobile navigation regression QA
        run: node tests/mobile-navigation.test.mjs
      - name: Run scope progress regression QA
        run: node tests/scope-progress.test.mjs
