name: Roadmap checkpoint QA

on:
  pull_request:
    paths:
      - 'ROADMAP_EXECUTION_STANDARD.md'
      - 'BOOK_PROJECT_ROADMAP_STANDARD.md'
      - 'BOOK_QA_GATES_STANDARD.md'
      - 'PROJECT_LINEAGE_OPPORTUNITY_STANDARD.md'
      - 'CHECKPOINT_SCOPE_STANDARD.md'
      - 'GLOBAL_CHECKPOINT_RULE.txt'
      - 'roadmap-checkpoint-runtime.js'
      - 'project-roadmaps.js'
      - 'app-config.js'
      - 'index.html'
      - 'service-worker.js'
      - 'supabase/migrations/**'
      - 'tests/project-roadmaps.test.mjs'
      - 'tests/roadmap-checkpoint-engine.test.mjs'
      - '.github/workflows/roadmap-checkpoint-qa.yml'

permissions:
  contents: read

jobs:
  roadmap-checkpoint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run roadmap checkpoint QA
        run: |
          node tests/project-roadmaps.test.mjs
          node tests/roadmap-checkpoint-engine.test.mjs
