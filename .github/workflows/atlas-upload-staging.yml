name: V7 atlas upload staging
on:
  push:
    branches:
      - cc-v7-atlas-upload-build-4
    paths:
      - '.cc-atlas-chunks/READY'
permissions:
  contents: write
jobs:
  reconstruct-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified 41-cover atlas
        shell: bash
        run: |
          set -euo pipefail
          cat .cc-atlas-chunks/part-* > /tmp/atlas.b64
          base64 --decode /tmp/atlas.b64 > book-cover-atlas-v2.webp
          test "$(wc -c < book-cover-atlas-v2.webp)" = "189930"
          test "$(sha256sum book-cover-atlas-v2.webp | cut -d' ' -f1)" = "701193f0aed70a8efceb0ec0bdcd13ef0d3718ba3e659b7a368b99877b208eba"
          python - <<'PY'
          from pathlib import Path
          p=Path('book-cover-atlas-v2.webp')
          b=p.read_bytes()
          assert b[:4] == b'RIFF'
          assert b[8:12] == b'WEBP'
          PY
      - name: Commit binary atlas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add book-cover-atlas-v2.webp
          git commit -m "Stage verified 41-cover atlas binary"
          git push origin HEAD:cc-v7-atlas-upload-build-4
