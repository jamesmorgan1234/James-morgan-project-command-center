name: Branch exact icon decoder
on:
  push:
    branches:
      - cc-v6-exact-approved-build
    paths:
      - 'icon-part-01.txt'
      - 'icon-part-02.txt'
      - 'icon-part-03.txt'
      - 'icon-part-04.txt'
      - 'icon-part-05.txt'
      - '.github/workflows/branch-icon-decode.yml'
permissions:
  contents: write
jobs:
  decode-approved-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc-v6-exact-approved-build
      - name: Decode approved launcher artwork
        run: |
          cat icon-part-01.txt icon-part-02.txt icon-part-03.txt icon-part-04.txt icon-part-05.txt | tr -d '\r\n ' | base64 -d > command-center-approved-icon-512.png
          python - <<'PY'
          from pathlib import Path
          p=Path('command-center-approved-icon-512.png')
          d=p.read_bytes()
          assert len(d) > 20000, len(d)
          assert d[:8] == b'\x89PNG\r\n\x1a\n'
          assert int.from_bytes(d[16:20], 'big') == 512
          assert int.from_bytes(d[20:24], 'big') == 512
          print('approved launcher icon decoded:', len(d), 'bytes')
          PY
      - name: Commit decoded icon to repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add command-center-approved-icon-512.png
          if git diff --cached --quiet; then
            echo 'Decoded icon already matches branch.'
          else
            git commit -m 'Install exact approved Command Center launcher icon'
            git push origin HEAD:cc-v6-exact-approved-build
          fi
