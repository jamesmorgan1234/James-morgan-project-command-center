name: P15.16 Module Test Diagnostic

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - '.github/workflows/p15-16-module-test-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  module-test-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clean-room
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clean-room/package-lock.json
      - name: Install locked zero-cost dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Current authority validation
        run: npm run audit:authority
      - name: Typecheck
        run: npm run typecheck
      - name: Legacy exclusion gate
        run: npm run check:legacy
      - name: Architecture source gate
        run: npm run check:architecture
      - name: Refresh P15.2 every-file review for exact head
        run: node scripts/p15-2-semantic-every-file-review.mjs --write
      - name: Repository audit gate
        run: npm run audit:repository
      - name: Build modules
        run: npm run build:modules
      - name: Build browser
        run: npm run build:browser
      - name: Requalify P15.6 through P15.12 receipts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/p15-6-historical-recovery-audit.mjs --write
          node scripts/p15-7-concurrency-claims-fencing-audit.mjs --write
          node scripts/p15-8-scheduler-failover-replay-audit.mjs --write
          node scripts/p15-9-foundry-steering-audit.mjs --write
          node scripts/p15-10-needs-me-boundary-resume-audit.mjs --write
          node scripts/p15-11-recovery-migration-provider-audit.mjs --write
          node scripts/p15-12-performance-load-soak-audit.mjs --write
      - name: Remove temporary diagnostic from final inventory
        shell: bash
        run: git -C "$GITHUB_WORKSPACE" rm .github/workflows/p15-16-module-test-diagnostic.yml
      - name: Refresh P15.2 for final post-diagnostic inventory
        run: node scripts/p15-2-semantic-every-file-review.mjs --write
      - name: Refresh repository audit for final inventory
        run: npm run audit:repository
      - name: Run unchanged module suite and capture TAP
        id: tests
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=tap tests/*.test.mjs > p15-16-module-tests.tap 2>&1
          code=$?
          set -e
          cat p15-16-module-tests.tap
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload final requalification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p15-16-final-requalification
          path: |
            clean-room/evidence/phase-receipts/P15_6.json
            clean-room/evidence/phase-receipts/P15_7.json
            clean-room/evidence/phase-receipts/P15_8.json
            clean-room/evidence/phase-receipts/P15_9.json
            clean-room/evidence/phase-receipts/P15_10.json
            clean-room/evidence/phase-receipts/P15_11.json
            clean-room/evidence/phase-receipts/P15_12.json
            clean-room/evidence/P15_2_SEMANTIC_EVERY_FILE_REVIEW.json
            clean-room/p15-16-module-tests.tap
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified receipt requalification and remove diagnostic
        if: steps.tests.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" fetch origin build/spec-lock-v2-clean-room
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse origin/build/spec-lock-v2-clean-room)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" diff --check
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add clean-room/evidence/phase-receipts/P15_{6,7,8,9,10,11,12}.json clean-room/evidence/P15_2_SEMANTIC_EVERY_FILE_REVIEW.json
          git -C "$GITHUB_WORKSPACE" add -u .github/workflows/p15-16-module-test-diagnostic.yml
          git -C "$GITHUB_WORKSPACE" commit -m "fix: requalify P15.6-P15.12 receipt bindings"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:build/spec-lock-v2-clean-room
      - name: Preserve unchanged suite result
        if: always()
        shell: bash
        run: test "${{ steps.tests.outputs.exit_code }}" -eq 0
