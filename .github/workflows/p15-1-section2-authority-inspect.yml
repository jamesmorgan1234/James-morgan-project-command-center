name: P15.1 Remaining Brain Recommendation Proof Inspection

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Persist exact existing proof names for remaining Brain recommendation rows
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='clean-room/tests';
          const needles=[
            /SelfImprovementGovernor/i,/assessRisk/i,/risk[_ -]?class/i,/impact/i,/cost/i,
            /contradiction/i,/knowledge[_ -]?gap/i,/unknown/i,/provenance/i,/citation/i,
            /fact/i,/idea/i,/rule/i,/portfolio/i,/context/i,/recommendation/i,/dedup/i,
            /architecture/i,/placement/i,/lifecycle/i,/success/i,/outcome/i,/evidence/i
          ];
          const lines=['# P15.1 remaining Brain/recommendation exact proof index',''];
          for(const name of fs.readdirSync(root).sort()){
            if(!name.endsWith('.test.mjs')) continue;
            const p=path.join(root,name), text=fs.readFileSync(p,'utf8');
            if(!needles.some(r=>r.test(text))) continue;
            const tests=[...text.matchAll(/test\(["'`]([^"'`]+)["'`]/g)].map(m=>m[1]);
            const matched=tests.filter(t=>needles.some(r=>r.test(t)));
            if(matched.length){lines.push(`## ${name}`);for(const t of matched)lines.push(`- ${t}`);lines.push('');}
          }
          fs.writeFileSync('clean-room/evidence/P15_1_REMAINING_BRAIN_RECOMMENDATION_PROOF_INDEX.md',lines.join('\n')+'\n');
          NODE
          git diff --check
          git config user.name jamesmorgan1234
          git config user.email JAMESMORGAN1234@YAHOO.COM
          git add clean-room/evidence/P15_1_REMAINING_BRAIN_RECOMMENDATION_PROOF_INDEX.md
          git commit -m "evidence: index remaining P15.1 Brain recommendation proofs"
          git push origin HEAD:build/spec-lock-v2-clean-room
