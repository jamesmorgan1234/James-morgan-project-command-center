name: P15.1 CCR-00386-00425 Exact Inspection

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Persist exact canonical wording and current truth state
        shell: bash
        run: |
          set -euo pipefail
          cd clean-room
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('evidence/category15-requirement-traceability.json','utf8'));
          const rows=d.requirements.filter(r=>{
            const n=Number(r.id.replace('CCR-',''));
            return n>=386&&n<=425;
          });
          if(rows.length!==40) throw new Error('Expected 40 rows, found '+rows.length);
          const lines=['# P15.1 exact inspection — CCR-00386..CCR-00425','',`Ledger checkpoint: ${d.closureSummary.verifiedCount} VERIFIED / ${d.closureSummary.unverifiedCount} UNVERIFIED.`,''];
          for(const r of rows) lines.push(`- \`${r.id}\` — **${r.truthState}** — ${String(r.requirement).replace(/\s+/g,' ').trim()}`);
          fs.writeFileSync('evidence/P15_1_BATCH_00386_00425_EXACT_INSPECTION.md',lines.join('\n')+'\n');
          NODE
          git diff --check
          git config user.name jamesmorgan1234
          git config user.email JAMESMORGAN1234@YAHOO.COM
          git add evidence/P15_1_BATCH_00386_00425_EXACT_INSPECTION.md
          git commit -m "evidence: inspect P15.1 CCR-00386 through CCR-00425"
          git push origin HEAD:build/spec-lock-v2-clean-room
