name: P15.1 PWA Qualification Diagnostic

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Persist exact PWA qualification errors without mutating ledger
        shell: bash
        run: |
          set -euo pipefail
          cd clean-room
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {assembleCurrentTraceability} from './scripts/p15-1-assemble-current-traceability.mjs';
          const d=assembleCurrentTraceability();
          const wanted=['CCR-00306','CCR-00307','CCR-00309','CCR-00312','CCR-00316'];
          const state=Object.fromEntries(d.requirements.filter(r=>wanted.includes(r.id)).map(r=>[r.id,{truthState:r.truthState,blocker:r.blocker,implementationLocations:r.implementationLocations,tests:r.tests}]));
          const payload={repositoryEvidenceValid:d.repositoryEvidence.valid,repositoryEvidenceErrors:d.repositoryEvidence.errors,qualificationErrors:d.assembly.qualificationErrors,closureSummary:d.closureSummary,state};
          console.log(JSON.stringify(payload,null,2));
          writeFileSync('evidence/P15_1_PWA_QUALIFICATION_DIAGNOSTIC.json',JSON.stringify(payload,null,2)+'\n');
          NODE
          git diff --check
          git config user.name jamesmorgan1234
          git config user.email JAMESMORGAN1234@YAHOO.COM
          git add evidence/P15_1_PWA_QUALIFICATION_DIAGNOSTIC.json
          git commit -m "evidence: save P15.1 PWA qualification diagnostic"
          git push origin HEAD:build/spec-lock-v2-clean-room
