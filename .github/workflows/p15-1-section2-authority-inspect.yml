name: P15.1 Design-System Candidate Inspection

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect exact canonical design-system rows and existing named proofs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const doc = JSON.parse(fs.readFileSync('clean-room/evidence/category15-requirement-traceability.json', 'utf8'));
          const recovered = JSON.parse(fs.readFileSync('clean-room/evidence/P15_1_RECOVERED_ORIGINAL_LEDGER_AUTHORITY.json', 'utf8'));
          const found = new Map();
          function visit(value) {
            if (!value || typeof value !== 'object') return;
            if (!Array.isArray(value)) {
              const id = value.id ?? value.requirementId ?? value.requirement_id ?? value.rowId ?? value.row_id;
              if (id && typeof value.requirement === 'string' && typeof value.truthState === 'string') found.set(String(id), value);
            }
            if (Array.isArray(value)) for (const item of value) visit(item);
            else for (const child of Object.values(value)) visit(child);
          }
          visit(doc);
          const rows = [...found.entries()].filter(([id]) => id >= 'CCR-00226' && id <= 'CCR-00265').sort(([a],[b])=>a.localeCompare(b));
          console.log(`RANGE_ROWS=${rows.length}`);
          for (const [id,row] of rows) console.log('---ROW---\n'+JSON.stringify({id,requirement:row.requirement,truthState:row.truthState}));
          const payload = recovered.canonicalCsv?.payload;
          if (!payload?.base64) throw new Error('Recovered canonical CSV payload unavailable');
          let raw = Buffer.from(payload.base64, 'base64');
          if (String(payload.encoding).includes('gzip')) raw = zlib.gunzipSync(raw);
          const text = raw.toString('utf8');
          function parseCsv(s) {
            const out=[]; let row=[],field='',quoted=false;
            for(let i=0;i<s.length;i++){
              const c=s[i];
              if(quoted){if(c==='"'&&s[i+1]==='"'){field+='"';i++;}else if(c==='"') quoted=false;else field+=c;}
              else if(c==='"') quoted=true;
              else if(c===','){row.push(field);field='';}
              else if(c==='\n'){row.push(field.replace(/\r$/,''));out.push(row);row=[];field='';}
              else field+=c;
            }
            if(field.length||row.length){row.push(field.replace(/\r$/,''));out.push(row);}
            return out;
          }
          const parsed=parseCsv(text); const header=parsed[0];
          const records=parsed.slice(1).map(values=>Object.fromEntries(header.map((h,i)=>[h,values[i]??''])));
          const canonical=records.filter(r=>r.canonical_id>='CCR-00226'&&r.canonical_id<='CCR-00265').sort((a,b)=>a.canonical_id.localeCompare(b.canonical_id));
          for(const row of canonical) console.log('---CANONICAL---\n'+JSON.stringify(row));
          NODE
          echo '---EXACT DESIGN TOKEN / PRIMITIVE / FIXTURE PROOF HITS---'
          grep -RniE --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.js' '(COMMAND_CENTER_GEOMETRY|COMMAND_CENTER_TYPE|COMMAND_CENTER_EFFECTS|APPROVED_REFERENCE_VIEWPORT|scaleReferencePx|APPROVED_VISUAL_REFERENCES|APPROVED_SCREEN_FIXTURES|createHomeGrid|equalCardHeight|PrimitiveKind|COMMAND_CENTER_PRIMITIVES|sharedPrimitiveClass|assertPhoneFirstViewport|classifyLayout|safe-area|safe area|overflow|vertical scroll|scroll owner|offline_state|loading-state|empty-state|error-state|blocked-state|progress-ring|status pill|icon frame)' clean-room/src clean-room/tests 2>/dev/null | head -n 1200 || true
