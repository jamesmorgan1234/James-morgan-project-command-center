name: P15.1 Agency Retry Recovery Proof Inspection

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Persist exact existing retry/recovery proof names
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const root='clean-room/tests';
          const terms=/(retry|max.?retr|circuit|dead.?letter|blocked|interrupted|reconcil|quota|connectiv|capability failure|provider failure|backoff|breaker|failure class)/i;
          const lines=['# P15.1 Agency retry/recovery exact proof index',''];
          for(const name of fs.readdirSync(root).sort()){
            if(!name.endsWith('.test.mjs')) continue;
            const p=path.join(root,name), text=fs.readFileSync(p,'utf8');
            const found=[...text.matchAll(/test\(["'`]([^"'`]+)["'`]/g)].map(m=>m[1]).filter(t=>terms.test(t));
            if(found.length){lines.push(`## ${name}`);for(const t of found)lines.push(`- ${t}`);lines.push('');}
          }
          fs.writeFileSync('clean-room/evidence/P15_1_AGENCY_RETRY_RECOVERY_PROOF_INDEX.md',lines.join('\n')+'\n');
          NODE
          git diff --check
          git config user.name jamesmorgan1234
          git config user.email JAMESMORGAN1234@YAHOO.COM
          git add clean-room/evidence/P15_1_AGENCY_RETRY_RECOVERY_PROOF_INDEX.md
          git commit -m "evidence: index P15.1 Agency retry recovery proofs"
          git push origin HEAD:build/spec-lock-v2-clean-room
