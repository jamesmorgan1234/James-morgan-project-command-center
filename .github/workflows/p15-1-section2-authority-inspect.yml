name: P15.1 Exact Next-Batch Inspection Report

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Persist exact CCR-00266 through CCR-00305 wording
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const doc=JSON.parse(fs.readFileSync('clean-room/evidence/category15-requirement-traceability.json','utf8'));
          const rows=doc.requirements.filter(r=>r.id>='CCR-00266'&&r.id<='CCR-00305').sort((a,b)=>a.id.localeCompare(b.id));
          if(rows.length!==40) throw new Error('Expected 40 rows, got '+rows.length);
          let out='# P15.1 exact inspection — CCR-00266 through CCR-00305\n\n';
          out+='Source ledger at trigger commit: `'+process.env.GITHUB_SHA+'`\n\n';
          for(const row of rows) out+=`- **${row.id}** — ${row.requirement} — current: **${row.truthState}**\n`;
          fs.writeFileSync('clean-room/evidence/P15_1_BATCH_00266_00305_EXACT_INSPECTION.md',out);
          NODE
          git diff --check
          git config user.name jamesmorgan1234
          git config user.email JAMESMORGAN1234@YAHOO.COM
          git add clean-room/evidence/P15_1_BATCH_00266_00305_EXACT_INSPECTION.md
          git commit -m "evidence: save exact P15.1 CCR-00266-00305 inspection"
          git push origin HEAD:build/spec-lock-v2-clean-room
