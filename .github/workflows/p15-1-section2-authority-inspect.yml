name: P15.1 Section 2 Authority Candidate Inspection

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - .github/workflows/p15-1-section2-authority-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect authority source model rows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('clean-room/evidence/category15-requirement-traceability.json', 'utf8'));
          const found = new Map();
          function visit(value) {
            if (!value || typeof value !== 'object') return;
            if (!Array.isArray(value)) {
              const id = value.id ?? value.requirementId ?? value.requirement_id ?? value.rowId ?? value.row_id;
              if (id && typeof value.requirement === 'string' && typeof value.truthState === 'string') found.set(String(id), value);
            }
            if (Array.isArray(value)) for (const item of value) visit(item);
            else for (const child of Object.values(value)) visit(child);
          }
          visit(doc);
          const rows = [...found.entries()]
            .filter(([id]) => id >= 'CCR-01875' && id <= 'CCR-01915')
            .sort(([a], [b]) => a.localeCompare(b));
          console.log(`RANGE_ROWS=${rows.length}`);
          for (const [id, row] of rows) {
            console.log('---ROW---');
            console.log(JSON.stringify({
              id,
              requirement: row.requirement,
              truthState: row.truthState,
              classification: row.classification ?? null,
              canonicalSourceIds: row.canonicalSourceIds ?? null,
              canonicalSourceFiles: row.canonicalSourceFiles ?? null,
              owningPhases: row.owningPhases ?? null,
              dependencies: row.dependencies ?? null,
              dependenciesVerified: row.dependenciesVerified ?? null,
              blocker: row.blocker ?? null,
              implementationLocations: row.implementationLocations ?? null,
              tests: row.tests ?? null
            }));
          }
          NODE
