name: P15.1 Mapping Profile

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - '.github/workflows/p15-1-mapping-profile.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Profile reviewed mappings against canonical architecture
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {currentReviewedMappings} from './clean-room/scripts/p15-1-current-reviewed-mappings.mjs';
          const trace=JSON.parse(fs.readFileSync('clean-room/evidence/category15-requirement-traceability.json','utf8'));
          const byId=new Map(trace.requirements.map(r=>[r.id,r]));
          const maps=currentReviewedMappings(process.cwd());
          const counts=(items)=>Object.entries(items.reduce((m,x)=>{m[x]=(m[x]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1]);
          const groups={};
          for(const m of maps){
            const r=byId.get(m.id); if(!r) continue;
            const key=r.architectureBranch||'(blank)';
            const g=groups[key]??={owner:r.architectureOwner||'',reviewed:0,phases:[],dependencies:[],locations:[],positive:[],negative:[],failure:[]};
            g.reviewed++;
            g.phases.push(...(m.owningPhases||[]));
            g.dependencies.push(JSON.stringify(m.dependencies||[]));
            g.locations.push(...(m.implementationLocations||[]));
            g.positive.push(...(m.tests?.positive?.references||[]));
            g.negative.push(...(m.tests?.negative?.references||[]));
            g.failure.push(...(m.tests?.failurePath?.references||[]));
          }
          const unresolved=trace.requirements.filter(r=>r.truthState==='UNVERIFIED');
          for(const [key,g] of Object.entries(groups)){
            g.unresolved=unresolved.filter(r=>(r.architectureBranch||'(blank)')===key).length;
            g.phases=counts(g.phases); g.dependencies=counts(g.dependencies); g.locations=counts(g.locations).slice(0,40);
            g.positive=counts(g.positive).slice(0,25); g.negative=counts(g.negative).slice(0,25); g.failure=counts(g.failure).slice(0,25);
          }
          const noReviewed={};
          for(const r of unresolved){if(!groups[r.architectureBranch||'(blank)']) noReviewed[r.architectureBranch||'(blank)']=(noReviewed[r.architectureBranch||'(blank)']||0)+1;}
          const out={sourceCommit:process.env.GITHUB_SHA,reviewedMappings:maps.length,unresolved:unresolved.length,groups,noReviewed};
          fs.writeFileSync('clean-room/evidence/P15_1_MAPPING_PROFILE.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add clean-room/evidence/P15_1_MAPPING_PROFILE.json
          git commit -m 'chore: profile current P15.1 reviewed mappings'
          git push origin HEAD:build/spec-lock-v2-clean-room
