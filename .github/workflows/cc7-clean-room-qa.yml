name: Command Center V7 Clean Room QA

on:
  push:
    branches:
      - rebuild/command-center-authoritative-v7
    paths:
      - 'authoritative-v7/**'
      - '.github/workflows/cc7-clean-room-qa.yml'
      - 'COMMAND_CENTER_APPROVED_VISUAL_SPEC.md'
      - 'COMMAND_CENTER_CLEAN_REBUILD_STANDARD.md'
  pull_request:
    paths:
      - 'authoritative-v7/**'
      - '.github/workflows/cc7-clean-room-qa.yml'
      - 'COMMAND_CENTER_APPROVED_VISUAL_SPEC.md'
      - 'COMMAND_CENTER_CLEAN_REBUILD_STANDARD.md'

permissions:
  contents: read

jobs:
  clean-room-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node
        run: node --version

      - name: Syntax check clean modules
        run: |
          node --check authoritative-v7/app.js
          node --check authoritative-v7/data.js
          node --check authoritative-v7/config.js
          node --check authoritative-v7/control-modules.js
          node --check authoritative-v7/pwa.js
          node --check authoritative-v7/service-worker.js
          node --check authoritative-v7/repository-audit.mjs
          node --check authoritative-v7/visual-fixture.js
          node --check authoritative-v7/qa.test.mjs

      - name: Run clean-room tests
        run: node --test authoritative-v7/qa.test.mjs

      - name: Verify isolated runtime entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq './manifest.webmanifest?v=1' authoritative-v7/index.html
          grep -Fq './theme.css?v=1' authoritative-v7/index.html
          grep -Fq './layout.css?v=1' authoritative-v7/index.html
          grep -Fq './app.js?v=1' authoritative-v7/index.html
          grep -Fq './pwa.js?v=1' authoritative-v7/index.html
          ! grep -Eiq 'command-center-v[456]|startup-loader|command-center-approved-ui|command-center-approved-nav' authoritative-v7/index.html
          ! grep -Fq '../app.js' authoritative-v7/index.html
          ! grep -Fq '../styles.css' authoritative-v7/index.html

      - name: Audit every repository file
        run: node authoritative-v7/repository-audit.mjs

      - name: Render approved-screen visual fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/cc7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No headless Chrome/Chromium available on runner"
            exit 1
          fi
          mkdir -p visual-output
          for screen in projects active next detail; do
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=2 \
              --window-size=432,768 \
              --screenshot="visual-output/${screen}.png" \
              "http://127.0.0.1:4173/authoritative-v7/visual-fixture.html?screen=${screen}"
          done
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path('visual-output').glob('*.png')):
              size=Image.open(path).size
              print(path.name,size)
              if size != (864,1536):
                  raise SystemExit(f'{path.name}: expected 864x1536, got {size}')
          PY

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cc7-visual-qa
          path: visual-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload exhaustive repository audit
        uses: actions/upload-artifact@v4
        with:
          name: cc7-repository-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
