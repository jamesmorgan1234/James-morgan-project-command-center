name: Command Center V7 Clean Room QA

on:
  push:
    branches:
      - main
      - rebuild/command-center-authoritative-v7
      - refine/global-refresh-and-approved-covers
      - refine/all-books-and-home-card-uniformity
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'command-center-approved-icon-192.png'
      - 'command-center-approved-icon-512.png'
      - 'authoritative-v7/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cc7-clean-room-qa.yml'
      - 'COMMAND_CENTER_APPROVED_VISUAL_SPEC.md'
      - 'COMMAND_CENTER_CLEAN_REBUILD_STANDARD.md'
      - 'COMMAND_CENTER_PRODUCT_ROADMAP.md'
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'command-center-approved-icon-192.png'
      - 'command-center-approved-icon-512.png'
      - 'authoritative-v7/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cc7-clean-room-qa.yml'
      - 'COMMAND_CENTER_APPROVED_VISUAL_SPEC.md'
      - 'COMMAND_CENTER_CLEAN_REBUILD_STANDARD.md'
      - 'COMMAND_CENTER_PRODUCT_ROADMAP.md'

permissions:
  contents: read

jobs:
  clean-room-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node
        run: node --version

      - name: Syntax check clean modules
        run: |
          node --check authoritative-v7/app.js
          node --check authoritative-v7/refinement.js
          node --check authoritative-v7/home-books-refinement.js
          node --check authoritative-v7/book-ui-fixes.js
          node --check authoritative-v7/publication-truth.js
          node --check authoritative-v7/agent-execution.js
          node --check authoritative-v7/data.js
          node --check authoritative-v7/config.js
          node --check authoritative-v7/control-modules.js
          node --check authoritative-v7/overview-screens.js
          node --check authoritative-v7/interaction-feedback.js
          node --check authoritative-v7/pwa.js
          node --check authoritative-v7/root-pwa.js
          node --check authoritative-v7/service-worker.js
          node --check service-worker.js
          node --check authoritative-v7/repository-audit.mjs
          node --check authoritative-v7/visual-fixture.js
          node --check authoritative-v7/qa.test.mjs
          node --check authoritative-v7/root-cutover.test.mjs
          node --check authoritative-v7/refinement.test.mjs
          node --check authoritative-v7/home-books-refinement.test.mjs
          node --check authoritative-v7/book-ui-fixes.test.mjs

      - name: Run clean-room tests
        run: |
          node --test authoritative-v7/qa.test.mjs
          node --test authoritative-v7/root-cutover.test.mjs
          node --test authoritative-v7/refinement.test.mjs
          node --test authoritative-v7/home-books-refinement.test.mjs
          node --test authoritative-v7/book-ui-fixes.test.mjs

      - name: Verify isolated construction entrypoint
        shell: bash
        run: |
          set -euo pipefail
          GEN="$(sed -nE 's|.*\./app\.js\?v=([0-9]+).*|\1|p' authoritative-v7/index.html | head -n1)"
          test -n "$GEN"
          for asset in manifest.webmanifest theme.css layout.css artwork.css app.js pwa.js; do
            grep -Fq "./${asset}?v=${GEN}" authoritative-v7/index.html
          done
          grep -Fq './refinement.css?v=1' authoritative-v7/index.html
          grep -Fq './refinement.js?v=1' authoritative-v7/index.html
          grep -Fq './home-books-refinement.css?v=1' authoritative-v7/index.html
          grep -Fq './home-books-refinement.js?v=2' authoritative-v7/index.html
          grep -Fq "const CACHE='command-center-v7-clean-10'" authoritative-v7/service-worker.js
          ! grep -Eiq 'command-center-v[456]|startup-loader|command-center-approved-ui|command-center-approved-nav' authoritative-v7/index.html
          ! grep -Fq '../app.js' authoritative-v7/index.html
          ! grep -Fq '../styles.css' authoritative-v7/index.html

      - name: Verify clean production root entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'data-command-center-runtime="v7-clean"' index.html
          grep -Fq './authoritative-v7/interaction-feedback.js?v=1' index.html
          grep -Fq './authoritative-v7/app.js?v=4' index.html
          grep -Fq './authoritative-v7/refinement.js?v=1' index.html
          grep -Fq './authoritative-v7/refinement.css?v=1' index.html
          grep -Fq './authoritative-v7/book-ui-fixes.js?v=1' index.html
          grep -Fq './authoritative-v7/book-ui-fixes.css?v=1' index.html
          grep -Fq './authoritative-v7/home-books-refinement.js?v=2' index.html
          grep -Fq './authoritative-v7/home-books-refinement.css?v=1' index.html
          grep -Fq './authoritative-v7/root-pwa.js?v=1' index.html
          ! grep -Eiq 'app-config\.js|startup-loader\.js|command-center-v[456]|command-center-approved-ui|command-center-approved-nav|command-center-authoritative-runtime' index.html
          grep -Fq "const CACHE='command-center-v7-root-6'" service-worker.js
          grep -Fq "key.startsWith('james-command-center-')" service-worker.js
          grep -Fq './authoritative-v7/interaction-feedback.js?v=1' service-worker.js
          grep -Fq './authoritative-v7/refinement.js?v=1' service-worker.js
          grep -Fq './authoritative-v7/refinement.css?v=1' service-worker.js
          grep -Fq './authoritative-v7/book-ui-fixes.js?v=1' service-worker.js
          grep -Fq './authoritative-v7/book-ui-fixes.css?v=1' service-worker.js
          grep -Fq './authoritative-v7/publication-truth.js' service-worker.js
          grep -Fq './authoritative-v7/agent-execution.js' service-worker.js
          grep -Fq './authoritative-v7/home-books-refinement.js?v=2' service-worker.js
          grep -Fq './authoritative-v7/home-books-refinement.css?v=1' service-worker.js
          grep -Fq './authoritative-v7/assets/book-cover-atlas-v2.webp' service-worker.js

      - name: Audit every repository file
        run: node authoritative-v7/repository-audit.mjs

      - name: Render approved-screen visual fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/cc7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No headless Chrome/Chromium available on runner"
            exit 1
          fi
          mkdir -p visual-output
          for screen in projects active next detail; do
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --force-device-scale-factor=2 \
              --window-size=432,768 \
              --screenshot="visual-output/${screen}.png" \
              "http://127.0.0.1:4173/authoritative-v7/visual-fixture.html?screen=${screen}"
          done
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --force-device-scale-factor=2 \
            --window-size=432,768 \
            --screenshot="visual-output/home.png" \
            "http://127.0.0.1:4173/authoritative-v7/home-visual-fixture.html"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for path in sorted(Path('visual-output').glob('*.png')):
              data=path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path.name}: not a PNG')
              width,height=struct.unpack('>II',data[16:24])
              print(path.name,(width,height))
              if (width,height)!=(864,1536):
                  raise SystemExit(f'{path.name}: expected 864x1536, got {(width,height)}')
          PY

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cc7-visual-qa
          path: visual-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload exhaustive repository audit
        uses: actions/upload-artifact@v4
        with:
          name: cc7-repository-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 7
