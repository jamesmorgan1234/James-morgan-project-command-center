name: Mobile app UX QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'startup-loader.js'
      - 'app-config.js'
      - 'service-worker.js'
      - 'deployment-release-manifest.json'
      - 'command-center-approved-ui.js'
      - 'command-center-approved-ui.css'
      - 'command-center-precise-progress.js'
      - 'command-center-approved-nav.js'
      - 'command-center-authoritative-runtime.js'
      - 'command-center-authoritative-runtime.css'
      - 'command-center-agent-truth.js'
      - 'command-center-advanced-lazy-loader.js'
      - 'command-center-work-boundary-mode.js'
      - 'command-center-work-approval-ui-v3.js'
      - 'command-center-work-approval-ui.css'
      - 'command-center-book-review-ui-v5.js'
      - 'command-center-book-review-ui.css'
      - 'tests/**'
      - '.github/workflows/mobile-app-ux-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-app-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release identity consistency
        run: node tests/00-release-identity-consistency.test.mjs
      - name: Syntax checks
        run: |
          node --check startup-loader.js
          node --check app-config.js
          node --check command-center-approved-ui.js
          node --check command-center-precise-progress.js
          node --check command-center-approved-nav.js
          node --check command-center-authoritative-runtime.js
          node --check command-center-agent-truth.js
          node --check command-center-advanced-lazy-loader.js
          node --check command-center-work-boundary-mode.js
          node --check command-center-work-approval-ui-v3.js
          node --check command-center-book-review-ui-v5.js
      - name: Normal runtime stability QA
        run: node tests/normal-runtime-stability.test.mjs
      - name: Approved mobile UX QA
        run: node tests/mobile-app-ux.test.mjs
      - name: Protected mobile navigation QA
        run: node tests/mobile-navigation.test.mjs
      - name: Agent runtime QA
        run: node tests/agent-mode-runtime.test.mjs
      - name: Refresh stability QA
        run: node tests/refresh-stability.test.mjs
      - name: V6 exact-approved QA
        run: node tests/v6-exact-approved.test.mjs
