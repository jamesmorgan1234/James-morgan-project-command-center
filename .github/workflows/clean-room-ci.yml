name: Command Center Clean-Room CI

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - 'clean-room/**'
      - '.github/workflows/clean-room-ci.yml'
  pull_request:
    paths:
      - 'clean-room/**'
      - '.github/workflows/clean-room-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clean-room/package.json
      - name: Install clean-room dependencies
        working-directory: clean-room
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run clean-room verification
        working-directory: clean-room
        run: npm test
