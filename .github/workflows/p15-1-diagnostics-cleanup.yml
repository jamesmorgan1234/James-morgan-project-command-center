name: P15.1 Diagnostics Cleanup

on:
  push:
    branches:
      - build/spec-lock-v2-clean-room
    paths:
      - '.github/workflows/p15-1-diagnostics-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Remove temporary diagnostics and self
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p15-1-unresolved-inventory.yml
          rm -f .github/workflows/p15-1-mapping-profile.yml
          rm -f .github/workflows/p15-1-snapshot-artifact.yml
          rm -f .github/workflows/p15-1-diagnostics-cleanup.yml
          rm -f clean-room/evidence/P15_1_MAPPING_PROFILE.json
          rm -rf clean-room/evidence/p15-1-unresolved-inventory
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove temporary P15.1 diagnostics'
          git push origin HEAD:build/spec-lock-v2-clean-room
