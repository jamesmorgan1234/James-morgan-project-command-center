name: Source sync and artwork polish QA

on:
  pull_request:
    paths:
      - 'source-health.js'
      - 'source-health.css'
      - 'command-center-artwork-polish.css'
      - 'command-center-agent-mode-completion.js'
      - 'tests/source-sync-home-polish.test.mjs'
      - '.github/workflows/source-sync-home-polish-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sync-home-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source-health runtime
        run: node --check source-health.js
      - name: Syntax check Agent completion loader
        run: node --check command-center-agent-mode-completion.js
      - name: Run source-sync/artwork checks
        run: node tests/source-sync-home-polish.test.mjs
      - name: Re-run protected mobile navigation checks
        run: node tests/mobile-navigation.test.mjs
