name: Security complete QA

on:
  pull_request:
    paths:
      - 'SECURITY_STANDARD.md'
      - 'command-center-security.css'
      - 'command-center-security.js'
      - 'command-center-security-auth.js'
      - 'command-center-security-completion.js'
      - 'app-config.js'
      - 'index.html'
      - 'service-worker.js'
      - 'supabase/migrations/20261021_security_*.sql'
      - 'tests/security-complete.test.mjs'
      - '.github/workflows/security-complete-qa.yml'

permissions:
  contents: read

jobs:
  security-complete-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Security runtime
        run: |
          node --check command-center-security.js
          node --check command-center-security-auth.js
          node --check command-center-security-completion.js
      - name: Run Security completion QA
        run: node tests/security-complete.test.mjs
