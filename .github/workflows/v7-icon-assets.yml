name: V7 icon asset generator
on:
  push:
    branches:
      - cc-v7-polish-and-icon-fix
    paths:
      - 'command-center-approved-icon-512.png'
      - '.github/workflows/v7-icon-assets.yml'
permissions:
  contents: write
jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc-v7-polish-and-icon-fix
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Repair approved source and generate launcher assets
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          source=Path('command-center-approved-icon-512.png')
          src=Image.open(source).convert('RGBA')
          assert src.size==(512,512), src.size
          # Re-save the exact approved visible artwork into a standards-clean PNG stream.
          src.save(source,optimize=True)
          src.resize((192,192),Image.Resampling.LANCZOS).save('command-center-approved-icon-192.png',optimize=True)
          for size in (192,512):
              canvas=Image.new('RGBA',(size,size),(0,0,0,255))
              inner=round(size*.80)
              art=src.resize((inner,inner),Image.Resampling.LANCZOS)
              off=((size-inner)//2,(size-inner)//2)
              canvas.alpha_composite(art,off)
              canvas.save(f'command-center-approved-icon-maskable-{size}.png',optimize=True)
          for name in ['command-center-approved-icon-512.png','command-center-approved-icon-192.png','command-center-approved-icon-maskable-192.png','command-center-approved-icon-maskable-512.png']:
              p=Path(name)
              d=p.read_bytes()
              assert d[:8]==b'\x89PNG\r\n\x1a\n'
              with Image.open(p) as check:
                  check.load()
                  assert check.size in {(192,192),(512,512)}
              assert len(d)>10000
              print(name,len(d))
          PY
      - name: Commit standards-clean launcher assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add command-center-approved-icon-512.png command-center-approved-icon-192.png command-center-approved-icon-maskable-192.png command-center-approved-icon-maskable-512.png
          if git diff --cached --quiet; then
            echo 'Launcher assets already match.'
          else
            git commit -m 'Repair and add install-safe Command Center launcher icons'
            git push origin HEAD:cc-v7-polish-and-icon-fix
          fi
