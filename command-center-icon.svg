<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Command Center</title>
  <desc id="desc">Rounded blue Command Center app icon with COMMAND above CENTER.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4a"/>
      <stop offset="0.55" stop-color="#153c86"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc2ff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="48" y="48" width="416" height="416" rx="100" fill="none" stroke="url(#rim)" stroke-width="8" opacity=".95"/>
  <circle cx="256" cy="128" r="18" fill="#93c5fd" opacity=".9"/>
  <path d="M176 164h160" stroke="#93c5fd" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  <text x="256" y="254" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="4">COMMAND</text>
  <text x="256" y="342" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" letter-spacing="5">CENTER</text>
</svg>
