<!doctype html>
<html lang="en" data-command-center-runtime="v7-clean">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Command Center</title>
  <link rel="manifest" href="./manifest.webmanifest?v=10">
  <link rel="icon" type="image/png" href="./command-center-approved-icon-512.png?cc7-root=2">
  <link rel="apple-touch-icon" href="./command-center-approved-icon-512.png?cc7-root=2">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://gmlsucpwliegwlxymjvp.supabase.co" crossorigin>
  <style>[hidden]{display:none!important}</style>
  <script type="importmap">{"imports":{"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/+esm":"./authoritative-v7/supabase-loader.js?v=1"}}</script>
  <link rel="stylesheet" href="./authoritative-v7/theme.css?v=4">
  <link rel="stylesheet" href="./authoritative-v7/layout.css?v=4">
  <link rel="stylesheet" href="./authoritative-v7/artwork.css?v=4">
  <link rel="stylesheet" href="./authoritative-v7/refinement.css?v=1">
  <link rel="stylesheet" href="./authoritative-v7/home-books-refinement.css?v=1">
  <link rel="stylesheet" href="./authoritative-v7/book-ui-fixes.css?v=1">
</head>
<body>
  <div id="ccBoot" class="cc-boot" role="status" aria-live="polite">Starting Command Center…</div>
  <main id="ccApp" class="cc-app" hidden></main>
  <div id="ccToastHost" class="cc-toast-host" aria-live="polite" aria-atomic="true"></div>
  <script>
  (()=>{
    const boot=document.getElementById('ccBoot');
    const app=document.getElementById('ccApp');
    if(!boot||!app)return;
    const key='cc7-startup-inline-recovery-v2';
    let settled=false;
    const done=()=>{
      if(settled)return;
      if(boot.hidden||!app.hidden){
        settled=true;
        try{sessionStorage.removeItem(key);}catch{}
        observer.disconnect();
      }
    };
    const observer=new MutationObserver(done);
    observer.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['hidden']});
    done();
    setTimeout(async()=>{
      if(settled||boot.hidden||!app.hidden)return;
      let tried=false;
      try{tried=sessionStorage.getItem(key)==='1';}catch{}
      if(tried){
        boot.textContent='Command Center startup failed. Tap to retry.';
        boot.setAttribute('role','button');
        boot.tabIndex=0;
        const retry=()=>{try{sessionStorage.removeItem(key);}catch{} location.reload();};
        boot.addEventListener('click',retry,{once:true});
        boot.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();retry();}},{once:true});
        return;
      }
      try{sessionStorage.setItem(key,'1');}catch{}
      boot.textContent='Recovering Command Center…';
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(reg=>reg.scope.startsWith(location.origin)).map(reg=>reg.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(name=>name.startsWith('command-center-v7-')||name.startsWith('james-command-center-')).map(name=>caches.delete(name)));
        }
      }catch{}
      const url=new URL(location.href);
      url.searchParams.set('cc7-inline-recover',Date.now().toString());
      location.replace(url.toString());
    },9000);
  })();
  </script>
  <script type="module" src="./authoritative-v7/interaction-feedback.js?v=1"></script>
  <script type="module" src="./authoritative-v7/app.js?v=4"></script>
  <script type="module" src="./authoritative-v7/refinement.js?v=1"></script>
  <script type="module" src="./authoritative-v7/book-ui-fixes.js?v=1"></script>
  <script type="module" src="./authoritative-v7/home-books-refinement.js?v=2"></script>
  <script type="module" src="./authoritative-v7/phone-layout-cover-fix.js?v=1"></script>
  <script type="module" src="./authoritative-v7/root-pwa.js?v=1"></script>
</body>
</html>
