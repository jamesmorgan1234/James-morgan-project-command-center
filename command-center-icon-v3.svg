<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Command Center</title>
  <desc id="desc">Rounded blue Command Center icon with a fully inset light-blue perimeter designed to remain visible on Samsung launcher shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4a"/>
      <stop offset="0.55" stop-color="#153c86"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9d2ff"/>
      <stop offset="1" stop-color="#6690ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020817" flood-opacity=".40"/>
    </filter>
  </defs>
  <rect x="42" y="42" width="428" height="428" rx="118" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="68" y="68" width="376" height="376" rx="108" fill="none" stroke="url(#rim)" stroke-width="10" opacity=".98"/>
  <circle cx="256" cy="132" r="18" fill="#a7ceff" opacity=".94"/>
  <path d="M178 168h156" stroke="#9dc9ff" stroke-width="8" stroke-linecap="round" opacity=".60"/>
  <text x="256" y="257" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="69" font-weight="800" letter-spacing="4">COMMAND</text>
  <text x="256" y="341" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="900" letter-spacing="5">CENTER</text>
</svg>
